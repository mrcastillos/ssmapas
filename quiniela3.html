<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Quiniela Mundial 2026</title>


<script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>


<style>
:root{
    --bg:#0f172a;
    --card:#1e293b;
    --accent:#22c55e;
    --accent2:#3b82f6;
    --text:#f8fafc;
}


*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Segoe UI, sans-serif;
}


body{
    background:linear-gradient(135deg,#0f172a,#1e293b);
    color:white;
    padding:20px;
}


h1{
    text-align:center;
    margin-bottom:20px;
}


.dashboard{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
    gap:15px;
    margin-bottom:25px;
}


.card{
    background:var(--card);
    border-radius:16px;
    padding:20px;
    box-shadow:0 8px 25px rgba(0,0,0,.35);
}


.card h2{
    font-size:14px;
    color:#94a3b8;
}


.card .valor{
    font-size:34px;
    font-weight:bold;
    margin-top:10px;
}


.grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:20px;
}


@media(max-width:900px){
    .grid{
        grid-template-columns:1fr;
    }
}


table{
    width:100%;
    border-collapse:collapse;
}


th{
    background:#334155;
    padding:10px;
}


td{
    padding:8px;
    border-bottom:1px solid #334155;
}


tr:hover{
    background:#1e293b;
}


.podio{
    display:flex;
    justify-content:center;
    gap:15px;
    margin-bottom:25px;
}


.puesto{
    padding:15px;
    border-radius:15px;
    text-align:center;
    min-width:140px;
}


.oro{background:#eab308;color:black;}
.plata{background:#cbd5e1;color:black;}
.bronce{background:#b45309;}


canvas{
    background:white;
    border-radius:15px;
    padding:10px;
}
</style>
</head>
<body>


<h1>🏆 Quiniela Mundial 2026</h1>


<div class="dashboard">


<div class="card">
<h2>Líder Actual</h2>
<div class="valor" id="lider">-</div>
</div>


<div class="card">
<h2>Puntos del Líder</h2>
<div class="valor" id="puntosLider">0</div>
</div>


<div class="card">
<h2>Partidos Jugados</h2>
<div class="valor" id="partidosJugados">0</div>
</div>


<div class="card">
<h2>Participantes</h2>
<div class="valor" id="participantes">0</div>
</div>


</div>


<div class="podio" id="podio"></div>


<div class="grid">


<div class="card">
<h2>Ranking General</h2>
<table id="tablaRanking">
<thead>
<tr>
<th>#</th>
<th>Nombre</th>
<th>Puntos</th>
<th>%</th>
</tr>
</thead>
<tbody></tbody>
</table>
</div>


<div class="card">
<h2>Aciertos por Participante</h2>
<canvas id="graficaRanking"></canvas>
</div>


</div>


<script>


async function cargarCSV(url){
    const r = await fetch(url + "?v=" + Date.now());
    const t = await r.text();


    return Papa.parse(t,{
        header:true,
        skipEmptyLines:true
    }).data;
}


async function actualizar(){


    const resultados = await cargarCSV('/resultado.csv');
    const participantes = await cargarCSV('resultados_participantes.csv');


    const mapaResultados = {};


    resultados.forEach(r=>{
        if(r.partido && r.resultado){
            mapaResultados[r.partido.trim()] =
            r.resultado.trim().toUpperCase();
        }
    });


    let ranking=[];


    participantes.forEach(p=>{


        let puntos=0;
        let jugados=0;


        Object.keys(mapaResultados).forEach(partido=>{


            if(mapaResultados[partido]!=""){


                jugados++;


                if(
                    p[partido] &&
                    p[partido].trim().toUpperCase()
                    ==
                    mapaResultados[partido]
                ){
                    puntos++;
                }
            }
        });


        ranking.push({
            nombre:p.Nombre,
            puntos,
            porcentaje:
            jugados>0
            ? ((puntos/jugados)*100).toFixed(1)
            : 0
        });


    });


    ranking.sort((a,b)=>b.puntos-a.puntos);


    document.getElementById("lider").innerText =
    ranking[0]?.nombre || "-";


    document.getElementById("puntosLider").innerText =
    ranking[0]?.puntos || 0;


    document.getElementById("participantes").innerText =
    ranking.length;


    document.getElementById("partidosJugados").innerText =
    Object.keys(mapaResultados).length;


    let podio="";


    const medallas=["🥇","🥈","🥉"];


    ranking.slice(0,3).forEach((p,i)=>{


        const clases=["oro","plata","bronce"];


        podio+=`
        <div class="puesto ${clases[i]}">
            <h2>${medallas[i]}</h2>
            <h3>${p.nombre}</h3>
            <strong>${p.puntos} pts</strong>
        </div>
        `;
    });


    document.getElementById("podio").innerHTML=podio;


    let filas="";


    ranking.forEach((p,i)=>{


        filas+=`
        <tr>
            <td>${i+1}</td>
            <td>${p.nombre}</td>
            <td>${p.puntos}</td>
            <td>${p.porcentaje}%</td>
        </tr>`;
    });


    document.querySelector("#tablaRanking tbody").innerHTML=filas;


    if(window.miGrafica){
        window.miGrafica.destroy();
    }


    const ctx =
    document.getElementById("graficaRanking");


    window.miGrafica = new Chart(ctx,{
        type:'bar',
        data:{
            labels:ranking.map(x=>x.nombre),
            datasets:[{
                label:'Aciertos',
                data:ranking.map(x=>x.puntos)
            }]
        },
        options:{
            responsive:true,
            plugins:{
                legend:{display:false}
            }
        }
    });


}


actualizar();
setInterval(actualizar,60000);


</script>


</body>
</html>
