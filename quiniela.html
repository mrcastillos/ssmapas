<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🏆 Quiniela Mundial 2026</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;800&display=swap" rel="stylesheet">

<script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>

:root{
--bg:#07111f;
--card:#101d31;
--card2:#172840;
--text:#ffffff;
--muted:#94a3b8;
--green:#10b981;
--gold:#fbbf24;
--silver:#cbd5e1;
--bronze:#d97706;
}

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Inter',sans-serif;
}

body{
background:
radial-gradient(circle at top,#16345c 0%,#07111f 50%);
color:var(--text);
padding:20px;
}

.container{
max-width:1400px;
margin:auto;
}

.header{
display:flex;
justify-content:space-between;
align-items:center;
margin-bottom:25px;
flex-wrap:wrap;
gap:10px;
}

.header h1{
font-size:2rem;
font-weight:800;
}

.update{
color:var(--muted);
}

.cards{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
gap:15px;
margin-bottom:25px;
}

.card{
background:rgba(16,29,49,.9);
backdrop-filter:blur(8px);
padding:20px;
border-radius:18px;
box-shadow:0 10px 30px rgba(0,0,0,.25);
}

.card h4{
color:var(--muted);
font-size:.9rem;
margin-bottom:8px;
}

.card .value{
font-size:2rem;
font-weight:800;
}

.podium{
display:grid;
grid-template-columns:1fr 1fr 1fr;
gap:15px;
margin-bottom:25px;
}

.podium-card{
padding:20px;
border-radius:18px;
text-align:center;
font-weight:bold;
}

.gold{
background:linear-gradient(135deg,#fbbf24,#f59e0b);
color:#111827;
}

.silver{
background:linear-gradient(135deg,#e2e8f0,#94a3b8);
color:#111827;
}

.bronze{
background:linear-gradient(135deg,#d97706,#92400e);
}

.grid{
display:grid;
grid-template-columns:1fr 1fr;
gap:20px;
margin-bottom:25px;
}

.panel{
background:var(--card);
border-radius:18px;
padding:20px;
}

.panel h3{
margin-bottom:15px;
}

table{
width:100%;
border-collapse:collapse;
}

th{
background:#1f3353;
padding:12px;
}

td{
padding:10px;
border-bottom:1px solid rgba(255,255,255,.05);
}

tr:hover{
background:#182946;
}

.pos1{color:gold;font-weight:bold;}
.pos2{color:#d1d5db;font-weight:bold;}
.pos3{color:#f59e0b;font-weight:bold;}

.search{
width:100%;
padding:12px;
margin-bottom:15px;
border:none;
border-radius:10px;
background:#1f3353;
color:white;
}

.chart-container{
height:500px;
}

@media(max-width:900px){

.grid{
grid-template-columns:1fr;
}

.podium{
grid-template-columns:1fr;
}

}

</style>
</head>

<body>

<div class="container">

<div class="header">
<div>
<h1>🏆 QUINIELA MUNDIAL 2026</h1>
<div class="update" id="actualizacion"></div>
</div>
</div>

<div class="cards">

<div class="card">
<h4>⚽ Partidos Jugados</h4>
<div class="value" id="jugados">0</div>
</div>

<div class="card">
<h4>👥 Participantes</h4>
<div class="value" id="participantes">0</div>
</div>

<div class="card">
<h4>🥇 Líder</h4>
<div class="value" id="lider">-</div>
</div>

<div class="card">
<h4>🎯 Mejor Efectividad</h4>
<div class="value" id="efectividad">0%</div>
</div>

</div>

<div class="podium" id="podium"></div>

<div class="grid">

<div class="panel">

<h3>📊 Ranking General</h3>

<input
type="text"
class="search"
placeholder="Buscar participante..."
id="buscar">

<table>

<thead>
<tr>
<th>#</th>
<th>Nombre</th>
<th>Puntos</th>
<th>%</th>
</tr>
</thead>

<tbody id="tablaRanking"></tbody>

</table>

</div>

<div class="panel">

<h3>📈 Aciertos por Participante</h3>

<div class="chart-container">
<canvas id="grafica"></canvas>
</div>

</div>

</div>

<div class="panel">

<h3>⚽ Partidos Jugados</h3>

<table>

<thead>
<tr>
<th>Partido</th>
<th>Encuentro</th>
<th>Resultado</th>
<th>% Acierto</th>
</tr>
</thead>

<tbody id="tablaPartidos"></tbody>

</table>

</div>

</div>

<script>

let chart;

async function leerCSV(url){

const r = await fetch(url + "?v=" + Date.now());
const txt = await r.text();

return Papa.parse(txt,{
header:true,
skipEmptyLines:true
}).data;

}

async function actualizar(){

const resultados =
await leerCSV("resultado.csv");

const participantes =
await leerCSV("resultados_participantes.csv");

const partidos =
await leerCSV("partidos.csv");

const oficiales = {};

resultados.forEach(r=>{

if(r.partido && r.resultado){

oficiales[r.partido.trim()] =
r.resultado.trim().toUpperCase();

}

});

let ranking = [];

participantes.forEach(p=>{

let puntos = 0;
let jugados = 0;

for(let i=1;i<=72;i++){

const oficial = oficiales[i];

if(!oficial) continue;

jugados++;

if(
String(p[i]).trim().toUpperCase()
=== oficial
){
puntos++;
}

}

ranking.push({
nombre:p.nombre,
puntos,
porcentaje:jugados ?
((puntos/jugados)*100).toFixed(1)
: 0
});

});

anking = ranking.map(r => ({
    ...r,
    nombre: String(r.nombre).trim().toUpperCase()
}));

ranking.sort((a,b)=>{

    if(b.puntos !== a.puntos){
        return b.puntos - a.puntos;
    }

    return a.nombre.localeCompare(
        b.nombre,
        'es',
        {
            sensitivity:'base',
            ignorePunctuation:true
        }
    );

});

let posicionActual = 1;

ranking.forEach((item,index)=>{

    if(index>0){

        if(item.puntos < ranking[index-1].puntos){
            posicionActual = index + 1;
        }

    }

    item.posicion = posicionActual;

});
ranking.sort((a,b)=>{

    // Orden principal: puntos descendente
    if(b.puntos !== a.puntos){
        return b.puntos - a.puntos;
    }

    // Desempate: orden alfabético
    return a.nombre.localeCompare(
        b.nombre,
        'es',
        {
            sensitivity:'base',
            ignorePunctuation:true
        }
    );

});

document.getElementById("jugados")
.innerHTML =
Object.keys(oficiales).length;

document.getElementById("participantes")
.innerHTML =
ranking.length;

document.getElementById("lider")
.innerHTML =
ranking[0]?.nombre || "-";

document.getElementById("efectividad")
.innerHTML =
ranking[0]?.porcentaje + "%";

document.getElementById("actualizacion")
.innerHTML =
"Actualizado: " +
new Date().toLocaleString();

const top3 = ranking.slice(0,3);

const clases =
["gold","silver","bronze"];

const emojis =
["🥇","🥈","🥉"];

let podio = "";

top3.forEach((p,i)=>{

podio += `
<div class="podium-card ${clases[i]}">
<h2>${emojis[i]}</h2>
<h3>${String(p.nombre).toUpperCase()}</h3>
<div>${p.puntos} pts</div>
<div>${p.porcentaje}%</div>
</div>
`;

});

document.getElementById("podium")
.innerHTML = podio;

let tabla = "";

ranking.forEach((p,i)=>{

let cls="";

if(i===0) cls="pos1";
if(i===1) cls="pos2";
if(i===2) cls="pos3";

tabla += `
<tr class="${cls}">
<td>${i+1}</td>
<td>${String(p.nombre).toUpperCase()}</td>
<td>${p.puntos}</td>
<td>${p.porcentaje}%</td>
</tr>
`;

});

document.getElementById("tablaRanking")
.innerHTML = tabla;

if(chart) chart.destroy();

chart = new Chart(
document.getElementById("grafica"),
{
type:"bar",
data:{
labels:ranking.map(x=>x.nombre),
datasets:[{
data:ranking.map(x=>x.puntos)
}]
},
options:{
indexAxis:'y',
responsive:true,
plugins:{
legend:{display:false}
}
}
}
);

let partidosHTML = "";

for(const p of partidos){

const id = p.partido;

if(!oficiales[id]) continue;

let aciertos = 0;

participantes.forEach(persona=>{

if(
String(persona[id]).trim().toUpperCase()
===
oficiales[id]
){
aciertos++;
}

});

const porcentaje =
((aciertos/participantes.length)*100)
.toFixed(1);

partidosHTML += `
<tr>
<td>${id}</td>
<td>${p.nombre}</td>
<td>${oficiales[id]}</td>
<td>${porcentaje}%</td>
</tr>
`;

}

document.getElementById("tablaPartidos")
.innerHTML = partidosHTML;

}

document
.getElementById("buscar")
.addEventListener("keyup",function(){

const filtro =
this.value.toLowerCase();

document
.querySelectorAll("#tablaRanking tr")
.forEach(row=>{

row.style.display =
row.innerText.toLowerCase()
.includes(filtro)
? ""
: "none";

});

});

actualizar();

setInterval(actualizar,60000);

</script>

</body>
</html>
```
