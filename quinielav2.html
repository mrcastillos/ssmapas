<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QUINIELA MUNDIAL 2026 - PREMIUM DASHBOARD</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;600;800&family=Rajdhani:wght@500;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Montserrat', sans-serif; background-color: #0b0f19; color: #f3f4f6; }
        .font-sports { font-family: 'Rajdhani', sans-serif; }
        .bracket-game { background: #111827; border: 1px solid #1f2937; border-radius: 6px; padding: 8px; }
        .custom-scrollbar::-webkit-scrollbar { height: 8px; width: 8px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: #111827; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #374151; border-radius: 4px; }
        .fifa-card { background: linear-gradient(135deg, #e5c060 0%, #b88728 50%, #926316 100%); border: 3px solid #f3e0a3; box-shadow: 0 10px 25px rgba(184, 135, 40, 0.3); clip-path: polygon(10% 0%, 90% 0%, 100% 10%, 100% 90%, 90% 100%, 10% 100%, 0% 90%, 0% 10%); }
    </style>
</head>
<body class="p-4 bg-slate-950">
    <div class="max-w-7xl mx-auto space-y-6">
        <header class="bg-slate-900 border-l-8 border-yellow-500 p-6 rounded-lg flex justify-between items-center">
            <h1 class="text-3xl font-extrabold font-sports text-white"><i class="fa-solid fa-trophy text-yellow-500"></i> QUINIELA MUNDIAL 2026</h1>
            <p id="last-updated" class="text-xs text-slate-400 font-sports uppercase tracking-widest">CARGANDO...</p>
        </header>

        <section class="bg-slate-900 rounded-xl p-6 border border-slate-800 shadow-xl font-sports">
            <h3 class="text-lg font-bold uppercase text-slate-200 mb-4">🗺️ RENDIMIENTO GENERAL DE SELECCIONES</h3>
            <div class="overflow-x-auto border border-slate-800 rounded-lg max-h-[380px] custom-scrollbar">
                <table class="w-full text-left border-collapse text-sm">
                    <thead>
                        <tr class="bg-slate-950 text-slate-400 uppercase text-[11px] border-b border-slate-800 sticky top-0 z-10 font-bold">
                            <th class="p-3 text-center">POS</th>
                            <th class="p-3">SELECCIÓN</th>
                            <th class="p-3 text-center">GR</th>
                            <th class="p-3 text-center">PJ</th>
                            <th class="p-3 text-center">G</th>
                            <th class="p-3 text-center">E</th>
                            <th class="p-3 text-center">P</th>
                            <th class="p-3 text-center">GF</th>
                            <th class="p-3 text-center">GC</th>
                            <th class="p-3 text-center">DG</th>
                            <th class="p-3 text-center text-emerald-400">PTS</th>
                        </tr>
                    </thead>
                    <tbody id="teams-leaderboard-body" class="divide-y divide-slate-800 text-xs text-slate-300"></tbody>
                </table>
            </div>
        </section>

        <section class="bg-slate-900 rounded-xl p-6 border border-slate-800 shadow-xl font-sports">
            <h3 class="text-lg font-bold tracking-wider uppercase text-slate-200 mb-6 border-b border-slate-800 pb-3">🏆 CUADRO ELIMINATORIO</h3>
            <div class="overflow-x-auto custom-scrollbar"><div class="min-w-[1200px] grid grid-cols-6 gap-4 text-center" id="bracket-container">
                <div><h5 class="text-xs font-black text-slate-400 mb-3 border-b border-slate-800 uppercase">16vos</h5><div id="bracket-16vos"></div></div>
                <div><h5 class="text-xs font-black text-slate-400 mb-3 border-b border-slate-800 uppercase">Octavos</h5><div id="bracket-octavos"></div></div>
                <div><h5 class="text-xs font-black text-slate-400 mb-3 border-b border-slate-800 uppercase">Cuartos</h5><div id="bracket-cuartos"></div></div>
                <div><h5 class="text-xs font-black text-slate-400 mb-3 border-b border-slate-800 uppercase">Semis</h5><div id="bracket-semis"></div></div>
                <div><h5 class="text-xs font-black text-amber-500 mb-3 border-b border-slate-800 uppercase">3er Lugar</h5><div id="bracket-tercer"></div></div>
                <div><h5 class="text-xs font-black text-yellow-400 mb-3 border-b border-slate-800 uppercase">Final</h5><div id="bracket-final"></div></div>
            </div></div>
        </section>
    </div>

    <script>
        document.addEventListener("DOMContentLoaded", async function() {
            const baseUrl = window.location.origin + window.location.pathname.substring(0, window.location.pathname.lastIndexOf('/') + 1);
            async function leerCSV(n) { try { let r = await fetch(baseUrl + n + '?t=' + Date.now()); return await r.text(); } catch(e) { return ""; } }

            let csvData = await leerCSV("Mundial2026.csv");
            let rows = csvData.split('\n').map(row => row.split(',').map(c => c.trim()));
            let tablaEquipos = {};
            let resultados = {};
            let eliminatorias = { "DICISEISAVOS":[], "OCTAVOS":[], "CUARTOS":[], "SEMIFINAL":[], "3ER LUGAR":[], "FINAL MUNDIAL 2026":[] };

            rows.forEach((row, i) => {
                if (i === 0 || row.length < 5) return;
                let num = parseInt(row[0]), abbr = row[2], grupo = row[3], fase = row[4], gL = row[5], gV = row[6];
                
                if (num <= 72 && abbr.includes("VS")) {
                    abbr.split("VS").forEach(t => { if(!tablaEquipos[t]) tablaEquipos[t] = {nombre:t, grupo:grupo, pj:0, g:0, e:0, p:0, gf:0, gc:0, dg:0, pts:0}; });
                    if(gL !== "" && gV !== "") {
                        let l = abbr.split("VS")[0].trim(), v = abbr.split("VS")[1].trim();
                        tablaEquipos[l].pj++; tablaEquipos[v].pj++;
                        tablaEquipos[l].gf += parseInt(gL); tablaEquipos[l].gc += parseInt(gV);
                        tablaEquipos[v].gf += parseInt(gV); tablaEquipos[v].gc += parseInt(gL);
                        if(parseInt(gL) > parseInt(gV)) { tablaEquipos[l].g++; tablaEquipos[v].p++; tablaEquipos[l].pts+=3; }
                        else if(parseInt(gL) < parseInt(gV)) { tablaEquipos[v].g++; tablaEquipos[l].p++; tablaEquipos[v].pts+=3; }
                        else { tablaEquipos[l].e++; tablaEquipos[v].e++; tablaEquipos[l].pts+=1; tablaEquipos[v].pts+=1; }
                    }
                }
                if(num >= 73) {
                    if(num <= 88) eliminatorias["DICISEISAVOS"].push({num, label:abbr, gL, gV});
                    else if(num <= 96) eliminatorias["OCTAVOS"].push({num, label:abbr, gL, gV});
                    else if(num <= 100) eliminatorias["CUARTOS"].push({num, label:abbr, gL, gV});
                    else if(num <= 102) eliminatorias["SEMIFINAL"].push({num, label:abbr, gL, gV});
                    else if(num == 103) eliminatorias["3ER LUGAR"].push({num, label:abbr, gL, gV});
                    else if(num == 104) eliminatorias["FINAL MUNDIAL 2026"].push({num, label:abbr, gL, gV});
                }
            });

            // Lógica de clasificación
            let lista = Object.values(tablaEquipos).sort((a,b) => b.pts - a.pts || (b.gf-b.gc) - (a.gf-a.gc));
            let tbody = document.getElementById("teams-leaderboard-body");
            lista.forEach((eq, i) => {
                tbody.insertAdjacentHTML('beforeend', `<tr><td class="p-3 text-center font-bold">${i+1}°</td><td class="p-3">${eq.nombre}</td><td class="p-3 text-center">${eq.grupo}</td><td class="p-3 text-center">${eq.pj}</td><td class="p-3 text-center">${eq.g}</td><td class="p-3 text-center">${eq.e}</td><td class="p-3 text-center">${eq.p}</td><td class="p-3 text-center">${eq.gf}</td><td class="p-3 text-center">${eq.gc}</td><td class="p-3 text-center">${eq.gf-eq.gc}</td><td class="p-3 text-center font-black text-emerald-400">${eq.pts}</td></tr>`);
            });

            // Renderizado de Brackets
            const brIds = {"DICISEISAVOS":"bracket-16vos", "OCTAVOS":"bracket-octavos", "CUARTOS":"bracket-cuartos", "SEMIFINAL":"bracket-semis", "3ER LUGAR":"bracket-tercer", "FINAL MUNDIAL 2026":"bracket-final"};
            for(let f in eliminatorias) {
                let div = document.getElementById(brIds[f]);
                eliminatorias[f].forEach(p => {
                    div.insertAdjacentHTML('beforeend', `<div class="bracket-game my-2 text-xs text-cyan-400 italic">${p.label || 'Por definir'}</div>`);
                });
            }
        });
    </script>
</body>
</html>
