<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DASHBOARD QUINIELA - MUNDIAL 2026</title>
    <!-- Google Fonts & FontAwesome -->
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --bg-principal: #0b0c10;
            --bg-card: #1f2833;
            --text-neon: #00ff66;
            --text-secondary: #45f3ff;
            --text-light: #c5c6c7;
            --text-white: #ffffff;
            --oro: #ffd700;
            --plata: #c0c0c0;
            --bronce: #cd7f32;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Montserrat', sans-serif;
        }

        body {
            background-color: var(--bg-principal);
            color: var(--text-light);
            background-image: radial-gradient(circle at 50% 10%, #1a2332 0%, #0b0c10 70%);
            min-height: 100vh;
            padding-bottom: 100px;
        }

        header {
            background: linear-gradient(180deg, rgba(0,0,0,0.8) 0%, rgba(0,0,0,0) 100%);
            padding: 30px 5%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid rgba(0, 255, 102, 0.2);
        }

        .logo-area h1 {
            font-weight: 900;
            font-size: 2.2rem;
            color: var(--text-white);
            letter-spacing: -1px;
            text-transform: uppercase;
        }

        .logo-area h1 span {
            color: var(--text-neon);
            text-shadow: 0 0 10px rgba(0, 255, 102, 0.5);
        }

        .update-badge {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(69, 243, 255, 0.3);
            padding: 8px 15px;
            border-radius: 4px;
            font-size: 0.85rem;
            color: var(--text-secondary);
        }

        .container {
            max-width: 1400px;
            margin: 40px auto;
            padding: 0 20px;
        }

        /* DISEÑO DE PODIO FOX SPORTS */
        .podium-section {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
            margin-bottom: 50px;
            align-items: flex-end;
        }

        .podium-card {
            background: linear-gradient(135deg, rgba(31, 40, 51, 0.9) 0%, rgba(11, 12, 16, 0.9) 100%);
            border-top: 5px solid var(--text-light);
            border-radius: 8px;
            padding: 25px;
            text-align: center;
            box-shadow: 0 15px 35px rgba(0,0,0,0.5);
            position: relative;
            transition: transform 0.3s ease;
        }

        .podium-card:hover {
            transform: translateY(-5px);
        }

        .podium-card.oro { border-color: var(--oro); grid-order: 2; height: 260px; }
        .podium-card.plata { border-color: var(--plata); grid-order: 1; height: 220px; }
        .podium-card.bronce { border-color: var(--bronce); grid-order: 3; height: 190px; }

        .p-1 { order: 2; }
        .p-2 { order: 1; }
        .p-3 { order: 3; }

        .medal-icon {
            font-size: 2.5rem;
            margin-bottom: 10px;
        }
        .oro .medal-icon { color: var(--oro); text-shadow: 0 0 10px var(--oro); }
        .plata .medal-icon { color: var(--plata); }
        .bronce .medal-icon { color: var(--bronce); }

        .podium-card h3 {
            font-size: 1.1rem;
            text-transform: uppercase;
            color: var(--text-white);
            margin-bottom: 15px;
            font-weight: 800;
        }

        .podium-names {
            font-size: 1.3rem;
            font-weight: bold;
            color: var(--text-white);
            margin-bottom: 10px;
        }

        .podium-pts {
            font-size: 0.9rem;
            color: var(--text-neon);
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        /* TABLA GENERAL DE POSICIONES */
        .section-title {
            font-size: 1.5rem;
            font-weight: 800;
            text-transform: uppercase;
            margin-bottom: 20px;
            color: var(--text-white);
            border-left: 4px solid var(--text-neon);
            padding-left: 15px;
        }

        .table-container {
            background: rgba(31, 40, 51, 0.5);
            border: 1px solid rgba(255,255,255,0.05);
            border-radius: 8px;
            overflow-x: auto;
            margin-bottom: 50px;
            backdrop-filter: blur(10px);
        }

        table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
        }

        th {
            background-color: rgba(0, 0, 0, 0.6);
            color: var(--text-white);
            text-transform: uppercase;
            font-size: 0.85rem;
            letter-spacing: 1px;
            padding: 18px 20px;
            font-weight: 800;
        }

        td {
            padding: 16px 20px;
            border-bottom: 1px solid rgba(255,255,255,0.05);
            font-size: 0.95rem;
        }

        tr:hover {
            background-color: rgba(255, 255, 255, 0.02);
        }

        .rank-number {
            font-weight: 900;
            color: var(--text-secondary);
        }

        .pts-badge {
            background: rgba(0, 255, 102, 0.1);
            color: var(--text-neon);
            padding: 5px 12px;
            border-radius: 4px;
            font-weight: 700;
            border: 1px solid rgba(0, 255, 102, 0.2);
        }

        /* SECCIÓN HEATMAP */
        .heatmap-grid {
            overflow-x: auto;
            background: #0f131a;
            padding: 20px;
            border-radius: 8px;
            border: 1px solid rgba(255,255,255,0.05);
        }

        .heatmap-table {
            width: max-content;
            min-width: 100%;
        }

        .heatmap-table th {
            padding: 8px;
            font-size: 0.7rem;
            transform: rotate(-45deg);
            height: 60px;
            white-space: nowrap;
        }

        .heatmap-table th.name-col, .heatmap-table td.name-col {
            transform: none;
            height: auto;
            position: sticky;
            left: 0;
            background: #0f131a;
            z-index: 2;
            font-size: 0.9rem;
            font-weight: 700;
            border-right: 2px solid rgba(255,255,255,0.1);
        }

        .cell-prediction {
            width: 35px;
            height: 35px;
            text-align: center !important;
            padding: 0;
            font-size: 0.8rem;
            font-weight: bold;
            color: #000;
        }

        .hit { background-color: #00ff66 !important; color: #0b0c10 !important; }
        .miss { background-color: #ff3333 !important; color: #fff !important; }
        .pending { background-color: #2b3a4a !important; color: rgba(255,255,255,0.4) !important; }

        /* FOOTER */
        footer {
            background: #050508;
            border-top: 1px solid rgba(255,255,255,0.05);
            text-align: center;
            padding: 25px;
            position: fixed;
            bottom: 0;
            width: 100%;
            z-index: 10;
        }

        footer p {
            font-size: 0.9rem;
            letter-spacing: 1px;
        }

        footer a {
            color: var(--text-neon);
            text-decoration: none;
            font-weight: bold;
            transition: all 0.3s ease;
        }

        footer a:hover {
            color: var(--text-secondary);
            text-shadow: 0 0 8px var(--text-secondary);
        }

        @media (max-width: 768px) {
            .podium-section { grid-template-columns: 1fr; }
            .podium-card.oro, .podium-card.plata, .podium-card.bronce { height: auto; order: initial !important; }
            header { flex-direction: column; gap: 15px; text-align: center; }
        }
    </style>
</head>
<body>

    <header>
        <div class="logo-area">
            <h1>Quiniela <span>Mundial 2026</span></h1>
        </div>
        <div class="update-badge" id="last-update">
            <i class="fa-solid fa-clock"></i> Actualizado el: Detectando...
        </div>
    </header>

    <div class="container">
        
        <!-- PODIO TOP 3 -->
        <h2 class="section-title">Líderes de la Jornada</h2>
        <div class="podium-section" id="podium-container"></div>

        <!-- TABLA GENERAL -->
        <h2 class="section-title">Tabla General de Posiciones</h2>
        <div class="table-container">
            <table>
                <thead>
                    <tr>
                        <th style="width: 70px;">Pos</th>
                        <th>Participante</th>
                        <th>Partidos Jugados</th>
                        <th>Aciertos</th>
                        <th>Puntos Totales</th>
                    </tr>
                </thead>
                <tbody id="leaderboard-body"></tbody>
            </table>
        </div>

        <!-- HEATMAP -->
        <h2 class="section-title">Matriz de Rendimiento (Heatmap)</h2>
        <div class="heatmap-grid">
            <table class="heatmap-table">
                <thead id="heatmap-head"></thead>
                <tbody id="heatmap-body"></tbody>
            </table>
        </div>

    </div>

    <footer>
        <p>Creado por <a href="https://www.facebook.com/tuxmar" target="_blank">Martín Sánchez <i class="fa-brands fa-facebook"></i></a> | Derechos Reservados &copy; 2026</p>
    </footer>

    <script>
        // Rutas locales relativas (asumiendo que están en la misma carpeta)
        const URL_MUNDIAL = 'mundial.csv';
        const URL_PARTICIPANTES = 'participantes.cvs'; // conserva la extensión .cvs que especificaste

        function parseCSV(text) {
            const lines = text.split('\n').map(line => line.trim()).filter(line => line !== '');
            if(lines.length === 0) return [];
            
            const headers = lines[0].split(',');
            return lines.slice(1).map(line => {
                const values = line.split(',');
                const obj = {};
                headers.forEach((header, index) => {
                    obj[header.trim()] = values[index] ? values[index].trim() : "";
                });
                return obj;
            });
        }

        async function initDashboard() {
            try {
                // 1. Obtener datos de mundial.csv y su fecha de modificación en el servidor
                const resMundial = await fetch(URL_MUNDIAL);
                if (!resMundial.ok) throw new Error("No se pudo cargar mundial.csv");
                
                // Extraer la fecha 'Last-Modified' del servidor de hosting
                const lastModifiedHeader = resMundial.headers.get('Last-Modified');
                if (lastModifiedHeader) {
                    const dateObj = new Date(lastModifiedHeader);
                    document.getElementById('last-update').innerHTML = `<i class="fa-solid fa-clock"></i> Actualizado el: ${dateObj.toLocaleString('es-MX')}`;
                } else {
                    document.getElementById('last-update').innerHTML = `<i class="fa-solid fa-clock"></i> Actualizado el: Recién sincronizado`;
                }
                
                const mundialText = await resMundial.text();
                const mundialData = parseCSV(mundialText);

                // 2. Obtener datos de participantes.cvs
                const resPart = await fetch(URL_PARTICIPANTES);
                if (!resPart.ok) throw new Error("No se pudo cargar participantes.cvs");
                const partText = await resPart.text();
                const participantesData = parseCSV(partText);

                // Mapear partidos jugados con resultado cargado
                const partidosReales = {};
                mundialData.forEach(p => {
                    if(p.RESULTADO && p.RESULTADO.trim() !== "") {
                        partidosReales[p.ID_PARTIDO] = p.RESULTADO.trim().toUpperCase();
                    }
                });

                // Calcular puntajes de los participantes
                const tablaPosiciones = [];
                participantesData.forEach(p => {
                    if(!p.nombre) return; // saltar líneas vacías
                    let aciertos = 0;
                    let jugados = 0;

                    Object.keys(partidosReales).forEach(idMatch => {
                        if (p[idMatch]) {
                            jugados++;
                            if (p[idMatch].trim().toUpperCase() === partidosReales[idMatch]) {
                                aciertos++;
                            }
                        }
                    });

                    tablaPosiciones.push({
                        nombre: p.nombre,
                        jugados: jugados,
                        aciertos: aciertos,
                        puntos: aciertos * 1, // 1 punto por acierto
                        predicciones: p
                    });
                });

                // Ordenar por puntos desc, luego por aciertos
                tablaPosiciones.sort((a, b) => b.puntos - a.puntos || b.aciertos - a.aciertos);

                // Agrupación para Podios (Manejo exacto de empates Oro/Plata/Bronce)
                const agrupadosPorPuntos = [];
                tablaPosiciones.forEach(p => {
                    let grupo = agrupadosPorPuntos.find(g => g.puntos === p.puntos);
                    if(!grupo) {
                        grupo = { puntos: p.puntos, nombres: [] };
                        agrupadosPorPuntos.push(grupo);
                    }
                    grupo.nombres.push(p.nombre.toUpperCase());
                });

                // Renderizar Podio
                const podiumContainer = document.getElementById('podium-container');
                podiumContainer.innerHTML = '';
                
                const medallas = [
                    { clase: 'oro', icon: 'fa-trophy', label: 'Oro', index: 1 },
                    { clase: 'plata', icon: 'fa-medal', label: 'Plata', index: 2 },
                    { clase: 'bronce', icon: 'fa-award', label: 'Bronce', index: 3 }
                ];

                const posicionesPodio = [1, 0, 2]; // Orden visual deportivo: Plata - Oro - Bronce
                posicionesPodio.forEach(idx => {
                    const medalla = medallas[idx];
                    const grupo = agrupadosPorPuntos[medalla.index - 1];

                    if(grupo) {
                        const nombresStr = grupo.nombres.join(' / ');
                        const cardHtml = `
                            <div class="podium-card ${medalla.clase} p-${medalla.index}">
                                <div class="medal-icon"><i class="fa-solid ${medalla.icon}"></i></div>
                                <h3>Lugar de ${medalla.label}</h3>
                                <div class="podium-names">${nombresStr}</div>
                                <div class="podium-pts">${grupo.puntos} PTS</div>
                            </div>
                        `;
                        podiumContainer.insertAdjacentHTML('beforeend', cardHtml);
                    }
                });

                // Renderizar Tabla General
                const leaderboardBody = document.getElementById('leaderboard-body');
                leaderboardBody.innerHTML = '';

                let rank = 1;
                tablaPosiciones.forEach((p, index) => {
                    if (index > 0 && p.puntos < tablaPosiciones[index - 1].puntos) {
                        rank = index + 1;
                    }
                    const row = `
                        <tr>
                            <td class="rank-number">#${rank}</td>
                            <td style="color: #fff; font-weight: 600;">${p.nombre.toUpperCase()}</td>
                            <td>${p.jugados}</td>
                            <td>${p.aciertos}</td>
                            <td><span class="pts-badge">${p.puntos} PTS</span></td>
                        </tr>
                    `;
                    leaderboardBody.insertAdjacentHTML('beforeend', row);
                });

                // Renderizar Heatmap
                const heatmapHead = document.getElementById('heatmap-head');
                const heatmapBody = document.getElementById('heatmap-body');
                
                let headHtml = `<tr><th class="name-col">Participante</th>`;
                mundialData.forEach(p => {
                    headHtml += `<th>${p.ID_PARTIDO}<br><small style="color:var(--text-secondary)">${p.ABREVIATURA}</small></th>`;
                });
                headHtml += `</tr>`;
                heatmapHead.innerHTML = headHtml;

                let bodyHtml = '';
                tablaPosiciones.forEach(p => {
                    bodyHtml += `<tr><td class="name-col">${p.nombre.toUpperCase()}</td>`;
                    mundialData.forEach(m => {
                        const pred = p.predicciones[m.ID_PARTIDO] ? p.predicciones[m.ID_PARTIDO].trim().toUpperCase() : '';
                        const real = partidosReales[m.ID_PARTIDO] || '';
                        
                        let claseCelda = 'pending';
                        if(real !== '') {
                            claseCelda = (pred === real) ? 'hit' : 'miss';
                        }
                        bodyHtml += `<td class="cell-prediction ${claseCelda}" title="${p.nombre} apostó: ${pred || 'N/A'} | Real: ${real || 'Pendiente'}">${pred || '-'}</td>`;
                    });
                    bodyHtml += `</tr>`;
                });
                heatmapBody.innerHTML = bodyHtml;

            } catch (error) {
                console.error("Error cargando la quiniela:", error);
                document.getElementById('last-update').innerText = "Error al cargar archivos locales (.csv)";
            }
        }

        window.onload = initDashboard;
    </script>
</body>
</html>
