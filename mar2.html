<!DOCTYPE html>

    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;600;800&family=Rajdhani:wght@500;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Montserrat', sans-serif;
            background-color: #0b0f19;
            color: #f3f4f6;
        }
        .font-sports {
            font-family: 'Rajdhani', sans-serif;
        }
        .fifa-card {
            background: linear-gradient(135deg, #e5c060 0%, #b88728 50%, #926316 100%);
            border: 3px solid #f3e0a3;
            box-shadow: 0 10px 25px rgba(184, 135, 40, 0.3);
            position: relative;
            clip-path: polygon(10% 0%, 90% 0%, 100% 10%, 100% 90%, 90% 100%, 10% 100%, 0% 90%, 0% 10%);
        }
        .fifa-card-silver {
            background: linear-gradient(135deg, #d1d5db 0%, #9ca3af 50%, #4b5563 100%);
            border: 3px solid #f3f4f6;
            box-shadow: 0 10px 25px rgba(156, 163, 175, 0.3);
        }
        .fifa-card-bronze {
            background: linear-gradient(135deg, #ca8a04 0%, #a16207 50%, #78350f 100%);
            border: 3px solid #fef08a;
            box-shadow: 0 10px 25px rgba(161, 98, 7, 0.3);
        }
        .custom-scrollbar::-webkit-scrollbar {
            height: 8px;
            width: 8px;
        }
        .custom-scrollbar::-webkit-scrollbar-track {
            background: #111827;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb {
            background: #374151;
            border-radius: 4px;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover {
            background: #4b5563;
        }
        @keyframes leader-glow {
            0%, 100% { box-shadow: 0 0 15px rgba(251, 191, 36, 0.5); border-color: #fbbf24; }
            50% { box-shadow: 0 0 30px rgba(251, 191, 36, 0.9); border-color: #fff; }
        }
        .leader-flash {
            animation: leader-glow 2s infinite;
        }
    </style>
</head>
