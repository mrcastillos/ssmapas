<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QUINIELA MUNDIAL 2026</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;800&family=Rajdhani:wght@500;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Montserrat', sans-serif; background-color: #0b0f19; color: #f3f4f6; }
        .font-sports { font-family: 'Rajdhani', sans-serif; }
        .fifa-card { background: linear-gradient(135deg, #e5c060 0%, #b88728 50%, #926316 100%); border: 3px solid #f3e0a3; position: relative; clip-path: polygon(10% 0%, 90% 0%, 100% 10%, 100% 90%, 90% 100%, 10% 100%, 0% 90%, 0% 10%); text-shadow: 1px 1px 2px rgba(0,0,0,0.4); }
        .fifa-card-silver { background: linear-gradient(135deg, #d1d5db 0%, #9ca3af 50%, #4b5563 100%); border: 3px solid #f3f4f6; }
        .fifa-card-bronze { background: linear-gradient(135deg, #ca8a04 0%, #a16207 50%, #78350f 100%); border: 3px solid #fef08a; }
        .custom-scrollbar::-webkit-scrollbar { height: 6px; width: 6px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: #111827; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #374151; border-radius: 4px; }
    </style>
</head>
<body class="p-4 md:p-6 bg-slate-950">
    <div class="max-w-6xl mx-auto space-y-6">
        
        <header class="bg-slate-900 border-l-8 border-yellow-500 p-5 rounded-lg shadow-xl flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4">
            <div>
                <h1 class="text-2xl md:text-3xl font-extrabold font-sports text-white tracking-wider">⚽ QUINIELA MUNDIAL 2026</h1>
                <p id="last-updated" class="text-xs font-semibold text-slate-400 font-sports uppercase tracking-widest mt-1">Sincronización por ID (WC2026-XXX) activa...</p>
            </div>
            <div class="bg-slate-800 px-3 py-1 rounded-full text-xs font-bold text-yellow-400 font-sports">🏆 PREMIUM STADIUM</div>
        </header>

        <section class="grid grid-cols-2 md:grid-cols-4 gap-4 font-sports">
            <div class="bg-slate-900 p-4 rounded-xl border border-slate-800 flex justify-between items-center">
                <div><p class="text-xs text-slate-400 uppercase">Líder</p><p id="kpi-leader" class="text-lg font-black text-yellow-400 mt-0.5">-</p></div>
            </div>
            <div class="bg-slate-900 p-4 rounded-xl border border-slate-800 flex justify-between items-center">
                <div><p class="text-xs text-slate-400 uppercase">Partidos Jugados</p><p id="kpi-played" class="text-xl font-black text-emerald-400 mt-0.5">0</p></div>
            </div>
            <div class="bg-slate-900 p-4 rounded-xl border border-slate-800 flex justify-between items-center">
                <div><p class="text-xs text-slate-400 uppercase">Máximo Score</p><p id="kpi-hits" class="text-xl font-black text-cyan-400 mt-0.5">0</p></div>
            </div>
            <div class="bg-slate-900 p-4 rounded-xl border border-slate-800 flex justify-between items-center">
                <div><p class="text-xs text-slate-400 uppercase">Participantes</p><p id="kpi-participants" class="text-xl font-black text-purple-400 mt-0.5">0</p></div>
            </div>
        </section>

        <section class="bg-slate-900 rounded-xl p-5 border border-slate-800 shadow-xl">
            <h3 class="text-base font-bold font-sports text-slate-200 uppercase tracking-wider border-b border-slate-800 pb-2 mb-4">
                <i class="fa-solid fa-list-ol text-emerald-500 mr-1"></i> Tabla de Posiciones Oficial
            </h3>
            <div id="ranking-container" class="space-y-2 max-h-[420px] overflow-y-auto pr-1 custom-scrollbar"></div>
        </section>
        
        <footer class="bg-slate-900/40 py-4 text-center rounded-lg border border-slate-900">
            <p class="text-yellow-500 font-sports font-bold tracking-widest text-xs uppercase">📷 Galería: @lente.abierto.mx</p>
        </footer>
    </div>

    <script>
        document.addEventListener("DOMContentLoaded", function() {
            const baseUrl = window.location.origin + window.location.pathname.substring(0, window.location.pathname.lastIndexOf('/') + 1);

            function procesarMatrizCSV(text) {
                if (!text) return [];
                if (text.charCodeAt(0) === 0xFEFF) { text = text.substr(1); }
                return text.split(/\r?\n|\r/).map(line => line.split(',').map(cell => cell.replace(/^["']|["']$/g, '').trim())).filter(row => row.length > 0 && row[0] !== '');
            }

            async function actualizar() {
                const mundial = await (await fetch(baseUrl + "Mundial2026.csv?nocache=" + new Date().getTime())).text();
                const part = await (await fetch(baseUrl + "resultados_participantes.csv?nocache=" + new Date().getTime())).text();

                let mRows = procesarMatrizCSV(mundial);
                let pRows = procesarMatrizCSV(part);
                
                let resultadosMap = {};
                let mHeader = mRows[0].map(h => h.toUpperCase());
                let idxId = mHeader.indexOf("ID_PARTIDO");
                let idxRes = mHeader.indexOf("RESULTADO");

                for(let i=1; i<mRows.length; i++) {
                    let id = mRows[i][idxId];
                    let res = mRows[i][idxRes];
                    if(id && res) resultadosMap[id.toUpperCase()] = res.toUpperCase();
                }

                let pHeader = pRows[0].map(h => h.toUpperCase());
                let idxNombre = pHeader.indexOf("NOMBRE");
                let finalData = [];

                for(let i=1; i<pRows.length; i++) {
                    let nombre = pRows[i][idxNombre];
                    let pts = 0;
                    for(let j=0; j<pHeader.length; j++) {
                        if(pHeader[j].startsWith("WC2026-")) {
                            if(pRows[i][j].toUpperCase() === resultadosMap[pHeader[j]]) pts++;
                        }
                    }
                    finalData.push({nombre, pts});
                }

                finalData.sort((a,b) => b.pts - a.pts);
                document.getElementById("kpi-leader").textContent = finalData[0].nombre;
                document.getElementById("kpi-played").textContent = Object.keys(resultadosMap).length;
                document.getElementById("kpi-hits").textContent = finalData[0].pts;
                document.getElementById("kpi-participants").textContent = finalData.length;

                let ranking = document.getElementById("ranking-container");
                finalData.forEach((p, i) => {
                    ranking.insertAdjacentHTML('beforeend', `
                        <div class="flex justify-between p-3 bg-slate-800 rounded border border-slate-700">
                            <span class="font-bold text-white">${i+1}. ${p.nombre}</span>
                            <span class="font-black text-yellow-400">${p.pts} PTS</span>
                        </div>`);
                });
            }
            actualizar();
        });
    </script>
</body>
</html>
