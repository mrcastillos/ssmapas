<style>
:root{

*{

}


body{

}


h1{

}


.dashboard{

    margin-bottom:25px;
}


.card{

.grid{

}

}


table{

}


th{

}


td{

}


tr:hover{

}


.podio{

    margin-bottom:25px;
}


.puesto{

}


.oro{background:#eab308;color:black;}
.plata{background:#cbd5e1;color:black;}
.bronce{background:#b45309;}


canvas{
    background:white;
    border-radius:15px;
    padding:10px;
}
</style>

            r.resultado.trim().toUpperCase();
        }
    });


    let ranking=[];


    participantes.forEach(p=>{


        let puntos=0;
        let jugados=0;


        Object.keys(mapaResultados).forEach(partido=>{


            if(mapaResultados[partido]!=""){


                jugados++;


                if(
                    p[partido] &&
                    p[partido].trim().toUpperCase()
                    ==
                    mapaResultados[partido]
                ){
                    puntos++;
                }
            }
        });


        ranking.push({
            nombre:p.Nombre,
            puntos,
            porcentaje:
            jugados>0
            ? ((puntos/jugados)*100).toFixed(1)
            : 0
        });


    });


    ranking.sort((a,b)=>b.puntos-a.puntos || a.nombre.localeCompare(b.nombre));

    ranking[0]?.nombre?.toUpperCase() || "-";

    ranking[0]?.puntos || 0;

    ranking.length;

    Object.keys(mapaResultados).length;
